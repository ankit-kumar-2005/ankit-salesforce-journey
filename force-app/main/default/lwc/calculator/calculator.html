<template>
  <div class="calculator" onkeydown={handleKeyDown} tabindex="0">
    <!-- Display -->
    <div class="display">
      <div class="input">{input}</div>
      <div class="result">{result}</div>
    </div>
    <!-- Buttons -->
    <div class="buttons">
      <!-- Top row -->
      <button class="function-btn" onclick={handleBackspaceOrAC}>{backspaceOrAC}</button>
      <button class="function-btn" data-value="+/-" onclick={handleClick}>+/-</button>
      <button class="function-btn" data-value="%" onclick={handleClick}>%</button>
      <button class="operator-btn" data-value="/" onclick={handleClick}>÷</button>
      
      <!-- Numbers & Operators -->
      <button class="number-btn" data-value="7" onclick={handleClick}>7</button>
      <button class="number-btn" data-value="8" onclick={handleClick}>8</button>
      <button class="number-btn" data-value="9" onclick={handleClick}>9</button>
      <button class="operator-btn" data-value="*" onclick={handleClick}>×</button>
      
      <button class="number-btn" data-value="4" onclick={handleClick}>4</button>
      <button class="number-btn" data-value="5" onclick={handleClick}>5</button>
      <button class="number-btn" data-value="6" onclick={handleClick}>6</button>
      <button class="operator-btn" data-value="-" onclick={handleClick}>−</button>
      
      <button class="number-btn" data-value="1" onclick={handleClick}>1</button>
      <button class="number-btn" data-value="2" onclick={handleClick}>2</button>
      <button class="number-btn" data-value="3" onclick={handleClick}>3</button>
      <button class="operator-btn" data-value="+" onclick={handleClick}>+</button>
      
      <!-- Bottom row -->
      <button class="dummy-btn"></button>
      <button class="number-btn" data-value="0" onclick={handleClick}>0</button>
      <button class="number-btn" data-value="." onclick={handleClick}>.</button>
       <button class="equals-btn" onclick={handleEqual}>=</button>
    </div>
  </div>
</template>
